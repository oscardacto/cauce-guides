description: "CMD /sofka-asdd:docs-as-is — documentación AS-IS (5 DA_ADE)"

providers:
  - id: anthropic:messages:claude-sonnet-4-6
    label: claude-sonnet-4-6

prompts:
  - '[{"role": "system", "content": "{{system_prompt}}"}, {"role": "user", "content": "{{input}}"}]'

defaultTest:
  vars:
    system_prompt: file://../prompts/system-orchestrator.txt

tests:
  - description: "CMD docs-as-is: genera set AS-IS (5 documentos DA_ADE)"
    vars:
      input: "/sofka-asdd:docs-as-is Sistema de créditos del banco ABC. Arquitectura actual: monolito Java + Oracle DB."
    assert:
      - type: icontains
        value: "sofka-asdd-solution-architect"
      - type: llm-rubric
        value: |
          El comando docs-as-is debe invocar sofka-asdd-solution-architect con skill sofka-docs
          para generar: DA_ADE36 (Business Drivers) + DA_ADE35 (Architecture Drivers) +
          DA_ADE45 (AS-IS) + DA_ADE34 (ADR) + DA_ADE43 (Dependencies).
          Los artefactos van en docs/architecture/DA_ADE{NN}_{slug}.md.

