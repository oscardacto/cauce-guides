description: "CMD /asdd:build — fase Construir"

providers:
  - id: anthropic:messages:claude-sonnet-4-6
    label: claude-sonnet-4-6

prompts:
  - '[{"role": "system", "content": "{{system_prompt}}"}, {"role": "user", "content": "{{input}}"}]'

defaultTest:
  vars:
    system_prompt: file://../prompts/system-orchestrator.txt

tests:
  - description: "CMD build: requiere spec + diseño aprobados"
    vars:
      input: "/asdd:build Implementar el servicio de notificaciones. Spec HU-018 aprobada, ADR-009 aceptado."
    assert:
      - type: icontains
        value: "asdd-developer-backend"
      - type: llm-rubric
        value: |
          El comando build debe: invocar asdd-developer-backend con los specs y ADR como contexto,
          tech-lead como soporte para code review,
          y NO implementar código sin spec y ADR referenciados.

