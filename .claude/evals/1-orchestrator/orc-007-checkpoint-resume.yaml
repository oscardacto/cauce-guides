description: "ORC-007 PROCESO: Checkpoint y resume — verificar .asdd-run.json al iniciar sesión"

providers:
  - id: anthropic:messages:claude-sonnet-4-6
    label: claude-sonnet-4-6

prompts:
  - '[{"role": "system", "content": "{{system_prompt}}"}, {"role": "user", "content": "{{input}}"}]'

defaultTest:
  vars:
    system_prompt: file://../prompts/system-orchestrator.txt

tests:
  - description: "PROCESO: Inicio de sesión → verifica estado del workflow anterior"
    vars:
      input: |
        Retomando el trabajo del proyecto de pagos. El archivo .asdd-run.json muestra:
        {
          "run_id": "2026-04-28-001",
          "status": "in_progress",
          "phase": "design",
          "completed_steps": ["specify", "analyze"],
          "resume_hint": "Invocar sofka-asdd-solution-architect para componentes C4 del módulo de pagos"
        }
    assert:
      - type: llm-rubric
        value: |
          La respuesta debe:
          1. Reconocer que existe un workflow en progreso (status: in_progress)
          2. NO reiniciar desde cero — retomar desde el estado guardado
          3. Seguir el resume_hint: invocar sofka-asdd-solution-architect para los diagramas C4
          4. Anunciar el agente con formato ORC-008 antes de invocar
          5. No volver a ejecutar fases ya completadas (specify y analyze)

  - description: "PROCESO: Estado complete → nuevo run"
    vars:
      input: |
        Iniciando nuevo proyecto. El .asdd-run.json actual dice status: "complete".
        Necesito empezar a trabajar en un sistema de gestión de inventario para retail.
    assert:
      - type: llm-rubric
        value: |
          La respuesta debe reconocer que el run anterior está completo
          y proponer iniciar un nuevo run con run_id fresco (YYYY-MM-DD-NNN).
          Debe clasificar el nuevo request como fase Especificar e iniciar el workflow.
