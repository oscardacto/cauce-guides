description: "WF-004 PROCESO+OUTPUT: Fase Construir — developer primario, alineado con diseño"

providers:
  - id: anthropic:messages:claude-sonnet-4-6
    label: claude-sonnet-4-6

prompts:
  - '[{"role": "system", "content": "{{system_prompt}}"}, {"role": "user", "content": "{{input}}"}]'

defaultTest:
  vars:
    system_prompt: file://../prompts/system-orchestrator.txt

tests:
  - description: "PROCESO WF-004: Sin spec aprobada → bloquear construcción"
    vars:
      input: |
        Quiero implementar directamente el servicio de notificaciones push.
        No tenemos spec aún pero las ideas están claras.
    assert:
      - type: llm-rubric
        value: |
          El orquestador DEBE bloquear la construcción sin spec aprobada.
          Principio fundamental ASDD: 'Spec First — nunca escribir código sin especificación aprobada'.
          Debe redirigir a la fase Especificar → Analizar → Diseñar antes de Construir.
          No debe delegar a asdd-developer-backend ni asdd-developer-frontend sin este prerequisito.

  - description: "PROCESO WF-004: Con spec y ADR aprobados → developer como primario"
    vars:
      input: |
        Spec HU-042 aprobada y ADR-007 aceptado. Implementar el servicio de notificaciones
        según el diseño. Incluye unit tests con 80% coverage mínimo.
    assert:
      - type: icontains
        value: "asdd-developer-backend"
      - type: llm-rubric
        value: |
          Con spec y ADR aprobados, el orquestador debe delegar a asdd-developer-backend (skill feature).
          Tech-lead puede incluirse como soporte para code review incremental.
          QA puede incluirse para definir la estrategia de tests paralela a la implementación.

  - description: "PROCESO WF-004: Cambio de infra durante construcción → platform-engineer como soporte"
    vars:
      input: |
        Implementando el módulo de procesamiento de imágenes. Necesito agregar un worker
        con Celery y configurar la cola en Redis. ¿Cómo organizamos esto?
    assert:
      - type: icontains
        value: "asdd-platform-engineer"
      - type: llm-rubric
        value: |
          El cambio de infraestructura (worker Celery + Redis) requiere asdd-platform-engineer
          como soporte en WF-004. Debe invocarse junto con asdd-developer-backend.
