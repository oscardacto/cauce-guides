asyncapi: 2.6.0
info:
  title: Order Events
  version: 1.0.0
  description: Eventos del dominio Orders publicados al cluster Kafka corporativo.

servers:
  production:
    url: kafka.retail.example:9092
    protocol: kafka
    description: Cluster Kafka producción (3 brokers, RF=3)

channels:
  orders.created.v1:
    description: Se publica cuando se crea una orden en estado pending.
    publish:
      operationId: emitOrderCreated
      message:
        $ref: '#/components/messages/OrderCreated'
    bindings:
      kafka:
        topic: orders.created.v1
        partitions: 12
        replicas: 3

  orders.paid.v1:
    description: Se publica cuando una orden pasa de pending a paid (pago capturado).
    publish:
      operationId: emitOrderPaid
      message:
        $ref: '#/components/messages/OrderPaid'
    bindings:
      kafka:
        topic: orders.paid.v1
        partitions: 12
        replicas: 3

  orders.cancelled.v1:
    description: Se publica cuando una orden es cancelada antes o después del pago.
    publish:
      operationId: emitOrderCancelled
      message:
        $ref: '#/components/messages/OrderCancelled'

components:
  messages:
    OrderCreated:
      name: OrderCreated
      title: Orden creada
      contentType: application/json
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        type: object
        required: [orderId, customerId, items, total, currency]
        properties:
          orderId:    { type: string, format: uuid }
          customerId: { type: string, format: uuid }
          items:
            type: array
            items:
              type: object
              properties:
                sku: { type: string }
                qty: { type: integer }
          total:    { type: number }
          currency: { type: string }

    OrderPaid:
      name: OrderPaid
      contentType: application/json
      headers: { $ref: '#/components/schemas/EventHeaders' }
      payload:
        type: object
        required: [orderId, paymentId, capturedAt]
        properties:
          orderId:    { type: string, format: uuid }
          paymentId:  { type: string, format: uuid }
          capturedAt: { type: string, format: date-time }

    OrderCancelled:
      name: OrderCancelled
      contentType: application/json
      headers: { $ref: '#/components/schemas/EventHeaders' }
      payload:
        type: object
        required: [orderId, reason]
        properties:
          orderId: { type: string, format: uuid }
          reason:  { type: string, enum: [customer, fraud, payment-failed, inventory] }

  schemas:
    EventHeaders:
      type: object
      required: [eventId, eventType, occurredAt, traceId]
      properties:
        eventId:    { type: string, format: uuid }
        eventType:  { type: string }
        occurredAt: { type: string, format: date-time }
        traceId:    { type: string }
