openapi: 3.1.0
info:
  title: {Service Name}
  version: 1.0.0
  description: {Qué hace este servicio y para quién.}
  contact:
    name: {Equipo dueño}
    email: {team@cliente.com}
servers:
  - url: https://api.{cliente}.com/v1
    description: Producción
  - url: https://api-staging.{cliente}.com/v1
    description: Staging

tags:
  - name: {recurso}
    description: {descripción breve}

paths:
  /{recursos}:
    get:
      operationId: list{Recursos}
      summary: Listar {recursos}
      tags: [{recurso}]
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:       { type: array, items: { $ref: '#/components/schemas/{Recurso}' } }
                  nextCursor: { type: string, nullable: true }
    post:
      operationId: create{Recurso}
      summary: Crear {recurso}
      tags: [{recurso}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Create{Recurso}Request' }
      responses:
        '201':
          description: Created
          headers:
            Location: { schema: { type: string, format: uri } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/{Recurso}' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/Unprocessable' }

components:
  schemas:
    {Recurso}:
      type: object
      required: [id, createdAt]
      properties:
        id:        { type: string, format: uuid, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }
        # …campos específicos…

    Create{Recurso}Request:
      type: object
      required: []
      properties:
        # …campos requeridos para crear…

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Unprocessable Entity
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
